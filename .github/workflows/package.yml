name: Build install packages

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Platforms to build in this run
        type: choice
        required: true
        default: all
        options:
          - all
          - windows-linux
          - macos
          - windows
          - linux
      reuse_run_id:
        description: Previous run ID whose successful artifacts should be reused
        type: string
        required: false
      publish_release:
        description: Publish all collected platform packages to a GitHub Release
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag for a manual publish, for example v1.0.1
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  QT_VERSION: "6.8.3"
  VCPKG_COMMIT: "827a2e1203bc19941126c657166da44f2623acc4"
  MAPNIK_VERSION: "4.3.0"

jobs:
  validate:
    name: Validate build metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GeoReader
        uses: actions/checkout@v5

      - name: Run build metadata tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  macos:
    name: macOS ${{ matrix.name }}
    needs: validate
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.build_target == 'all' ||
      inputs.build_target == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            architecture: x86_64
          - name: Apple-Silicon
            runner: macos-15
            architecture: arm64

    steps:
      - name: Check out GeoReader
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: brew install cmake ninja qt gdal mapnik dylibbundler

      - name: Build and create DMG
        run: |
          ./scripts/build.sh --type Release --clean-first --package --package-format dmg -- \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GeoReader-macOS-${{ matrix.architecture }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: validate
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.build_target == 'all' ||
      inputs.build_target == 'windows-linux' ||
      inputs.build_target == 'windows'
    runs-on: windows-2025

    steps:
      - name: Check out GeoReader
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Enable Visual Studio 2022 x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Check out vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: >-
            vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-mapnik-${{
            env.MAPNIK_VERSION }}-${{ hashFiles(
            'vcpkg.json', 'scripts/prepare_vcpkg_overlay.py',
            'cmake/triplets/x64-windows-release.cmake') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Prepare Mapnik 4.3 vcpkg overlay
        shell: pwsh
        run: >-
          python scripts/prepare_vcpkg_overlay.py
          --vcpkg-root .vcpkg
          --output .vcpkg-overlays

      - name: Install pinned vcpkg dependencies
        shell: pwsh
        run: |
          $installed = "$env:GITHUB_WORKSPACE/vcpkg_installed"
          .\.vcpkg\vcpkg.exe install `
            --triplet=x64-windows-release `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$installed" `
            --overlay-ports="$env:GITHUB_WORKSPACE/.vcpkg-overlays" `
            --overlay-triplets="$env:GITHUB_WORKSPACE/cmake/triplets"

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and create NSIS installer
        shell: pwsh
        run: |
          $installed = "$env:GITHUB_WORKSPACE/vcpkg_installed"
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC cl.exe was not found in the configured build environment."
          }
          $pkgConfig = Get-ChildItem `
            -Path $installed `
            -Recurse `
            -Filter "pkgconf.exe" |
            Select-Object -First 1
          if (-not $pkgConfig) {
            throw "vcpkg pkgconf.exe was not found below $installed."
          }
          $env:PKG_CONFIG_PATH = @(
            "$installed/x64-windows-release/lib/pkgconfig"
            "$installed/x64-windows-release/share/pkgconfig"
          ) -join ";"
          .\scripts\build.ps1 -Type Release -CleanFirst -Package -PackageFormat nsis `
            -CMakeArgs @(
              "-DCMAKE_CXX_COMPILER=cl.exe"
              "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake"
              "-DPKG_CONFIG_EXECUTABLE=$($pkgConfig.FullName)"
              "-DVCPKG_INSTALLED_DIR=$installed"
              "-DVCPKG_TARGET_TRIPLET=x64-windows-release"
              "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE/.vcpkg-overlays"
              "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/cmake/triplets"
              "-DGEOREADER_BUNDLE_VCPKG_RUNTIME=ON"
              "-DGEOREADER_VCPKG_RUNTIME_ROOT=$installed/x64-windows-release"
            )

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GeoReader-Windows-x64
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux x64 DEB and RPM
    needs: validate
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.build_target == 'all' ||
      inputs.build_target == 'windows-linux' ||
      inputs.build_target == 'linux'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GeoReader
        uses: actions/checkout@v5

      - name: Install system build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            cpio \
            libtool \
            ninja-build \
            patchelf \
            rpm \
            libgl1-mesa-dev \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtwaylandcompositor
          cache: true

      - name: Check out vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: >-
            vcpkg-linux-x64-mapnik-input-v2-${{
            env.VCPKG_COMMIT }}-mapnik-${{
            env.MAPNIK_VERSION }}-${{ hashFiles(
            'vcpkg.json', 'scripts/prepare_vcpkg_overlay.py',
            'cmake/triplets/x64-linux-release.cmake') }}

      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Prepare Mapnik 4.3 vcpkg overlay
        run: >-
          python scripts/prepare_vcpkg_overlay.py
          --vcpkg-root .vcpkg
          --output .vcpkg-overlays

      - name: Install pinned vcpkg dependencies
        run: |
          installed="$GITHUB_WORKSPACE/vcpkg_installed"
          ./.vcpkg/vcpkg install \
            --triplet=x64-linux-release \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$installed" \
            --overlay-ports="$GITHUB_WORKSPACE/.vcpkg-overlays" \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/triplets"

      - name: Verify vcpkg Mapnik input plugins
        run: |
          triplet_root="$GITHUB_WORKSPACE/vcpkg_installed/x64-linux-release"
          geojson_plugin="$(
            find "$triplet_root" -type f -name 'geojson.input' -print -quit
          )"
          if [[ -z "$geojson_plugin" ]]; then
            echo "::error title=Incomplete vcpkg Mapnik::Missing geojson.input" >&2
            find "$triplet_root" -iname '*mapnik*' -o -name '*.input' | sort
            exit 1
          fi

          input_dir="$(dirname "$geojson_plugin")"
          missing=0
          for plugin in geojson.input raster.input shape.input; do
            if [[ ! -f "$input_dir/$plugin" ]]; then
              echo "::error title=Incomplete vcpkg Mapnik::Missing $plugin" >&2
              missing=1
            fi
          done
          if [[ ! -f "$input_dir/gdal+ogr.input" ]]; then
            for plugin in gdal.input ogr.input; do
              if [[ ! -f "$input_dir/$plugin" ]]; then
                echo "::error title=Incomplete vcpkg Mapnik::Missing $plugin" >&2
                missing=1
              fi
            done
          fi
          if (( missing != 0 )); then
            find "$input_dir" -maxdepth 1 -type f -print | sort
            exit 1
          fi
          echo "Verified Mapnik input plugins in $input_dir"
          find "$input_dir" -maxdepth 1 -type f -print | sort

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Prepare relocatable vcpkg runtime
        run: |
          triplet_root="$GITHUB_WORKSPACE/vcpkg_installed/x64-linux-release"
          while IFS= read -r -d '' library; do
            if patchelf --print-rpath "$library" >/dev/null 2>&1; then
              patchelf --set-rpath '$ORIGIN' "$library"
            fi
          done < <(
            find "$triplet_root/lib" -maxdepth 1 -type f \
              \( -name '*.so' -o -name '*.so.*' \) -print0
          )

          while IFS= read -r -d '' plugin; do
            patchelf --set-rpath '$ORIGIN/../..' "$plugin"
          done < <(
            find "$triplet_root" -type f -name '*.input' -print0
          )

      - name: Build and create DEB/RPM packages
        run: |
          installed="$GITHUB_WORKSPACE/vcpkg_installed"
          ./scripts/build.sh --type Release --clean-first --package --package-format all -- \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$installed" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/.vcpkg-overlays" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets" \
            -DGEOREADER_BUNDLE_VCPKG_RUNTIME=ON \
            -DGEOREADER_VCPKG_RUNTIME_ROOT="$installed/x64-linux-release"

      - name: Verify Linux packages and packaged runtime
        run: |
          deb_package="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_package="$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$deb_package"
          test -n "$rpm_package"

          deb_root="$(mktemp -d "$RUNNER_TEMP/georeader-deb.XXXXXX")"
          rpm_root="$(mktemp -d "$RUNNER_TEMP/georeader-rpm.XXXXXX")"
          dpkg-deb -x "$deb_package" "$deb_root"
          rpm_package="$(realpath "$rpm_package")"
          (
            cd "$rpm_root"
            rpm2cpio "$rpm_package" | cpio --extract --make-directories --quiet
          )

          require_package_entry() {
            local package_name="$1"
            local package_root="$2"
            local pattern="$3"
            local description="$4"
            local match
            match="$(find "$package_root" -path "$pattern" -print -quit)"
            if [[ -z "$match" ]]; then
              echo "${package_name}: missing ${description} (${pattern})" >&2
              echo "::error title=Incomplete ${package_name} package::Missing ${description}" >&2
              return 1
            fi
          }
          package_names=(DEB RPM)
          package_roots=("$deb_root" "$rpm_root")
          for index in "${!package_names[@]}"; do
            package_name="${package_names[$index]}"
            package_root="${package_roots[$index]}"
            require_package_entry "$package_name" "$package_root" \
              '*/mapnik/input/geojson.input' "Mapnik GeoJSON input plugin"
            if [[ -z "$(find "$package_root" \
                -path '*/mapnik/input/gdal+ogr.input' -print -quit)" ]]; then
              require_package_entry "$package_name" "$package_root" \
                '*/mapnik/input/gdal.input' "Mapnik GDAL input plugin"
              require_package_entry "$package_name" "$package_root" \
                '*/mapnik/input/ogr.input' "Mapnik OGR input plugin"
            fi
            require_package_entry "$package_name" "$package_root" \
              '*/mapnik/input/raster.input' "Mapnik raster input plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/mapnik/input/shape.input' "Mapnik shape input plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/platforms/libqoffscreen.so' "Qt offscreen platform plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/platforms/libqwayland*.so' "Qt Wayland platform plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/platforminputcontexts/libcomposeplatforminputcontextplugin.so' \
              "Qt Compose input method plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/platforminputcontexts/libibusplatforminputcontextplugin.so' \
              "Qt IBus input method plugin"
            require_package_entry "$package_name" "$package_root" \
              '*/libQt6DBus.so.6*' "Qt DBus runtime library"
          done

          executable="$deb_root/usr/bin/GeoReader"
          test -x "$executable"

          offscreen_plugin="$(find "$deb_root" \
            -path '*/platforms/libqoffscreen.so' -print -quit)"
          wayland_plugin="$(find "$deb_root" \
            -path '*/platforms/libqwayland*.so' -print -quit)"
          compose_plugin="$(find "$deb_root" \
            -path '*/platforminputcontexts/libcomposeplatforminputcontextplugin.so' \
            -print -quit)"
          ibus_plugin="$(find "$deb_root" \
            -path '*/platforminputcontexts/libibusplatforminputcontextplugin.so' \
            -print -quit)"
          mapfile -t mapnik_plugins < <(
            find "$deb_root" -path '*/mapnik/input/*.input' -type f -print
          )
          test "${#mapnik_plugins[@]}" -ge 4
          for runtime_file in \
              "$executable" \
              "$offscreen_plugin" \
              "$wayland_plugin" \
              "$compose_plugin" \
              "$ibus_plugin" \
              "${mapnik_plugins[@]}"; do
            test -f "$runtime_file"
            if ldd "$runtime_file" | grep -F 'not found'; then
              echo "Packaged runtime has missing libraries: $runtime_file" >&2
              exit 1
            fi
          done

          source_mapnik_input="$(
            find "$GITHUB_WORKSPACE/vcpkg_installed/x64-linux-release" \
              -type f -name 'geojson.input' -printf '%h\n' -quit
          )"
          test -n "$source_mapnik_input"
          mv "$source_mapnik_input" "${source_mapnik_input}.build-only"
          trap 'mv "${source_mapnik_input}.build-only" "$source_mapnik_input"' EXIT

          QT_QPA_PLATFORM=offscreen \
          QT_QUICK_BACKEND=software \
            "$executable" \
            --smoke-test "$GITHUB_WORKSPACE/tests/data/demo.geojson"

      - name: Upload Linux packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoReader-Linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: warn

  release:
    name: Publish complete cross-platform release
    needs: [macos, windows, linux]
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_release
        )
      ) &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download successful packages from a previous run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
          pattern: GeoReader-*
          path: dist
          merge-multiple: true

      - name: Download packages built in this run
        uses: actions/download-artifact@v4
        with:
          pattern: GeoReader-*
          path: dist
          merge-multiple: true

      - name: Verify the complete platform package set
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -name '*x86_64*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*arm64*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
          find dist -maxdepth 1 -type f -print | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.release_tag || github.ref_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when publish_release is enabled." >&2
            exit 2
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "GeoReader $RELEASE_TAG" \
              --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber
